wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
  bluez5.codecs = [ sbc ]
}

# Keep smartphone media sources on the default playback path so the selected
# RAOP sink receives incoming Bluetooth audio automatically.
# Keep the advertised Bluetooth surface conservative: this bridge only needs to
# receive A2DP audio from phones, and SBC is the mandatory baseline codec.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
