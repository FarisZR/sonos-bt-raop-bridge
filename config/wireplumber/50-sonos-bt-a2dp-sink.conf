wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}

# Keep smartphone media sources on the default playback path so the selected
# RAOP sink receives incoming Bluetooth audio automatically.
# The loudspeaker device class drives phone classification on this host, while
# keeping both A2DP roles registered preserves the working inbound stream path.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
